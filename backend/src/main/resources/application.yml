spring:
  application:
    name: Forge Tycoon
  server:
    port: ${PORT:8080}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:tycoon}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
